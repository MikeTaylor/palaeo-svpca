<Directory /home/mike/palaeo-svpca/htdocs>
  AllowOverride AuthConfig
</Directory>

<VirtualHost *:80>
  ServerName svpca.org
  DocumentRoot /home/mike/palaeo-svpca/htdocs
  <Directory /home/mike/palaeo-svpca/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
  RewriteEngine on
  RewriteCond %{SERVER_NAME} =svpca.org
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:80>
  ServerName legacy.svpca.org
  DocumentRoot /home/mike/palaeo-svpca/htdocs
  <Directory /home/mike/palaeo-svpca/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
  RewriteEngine on
  RewriteCond %{SERVER_NAME} =legacy.svpca.org
  RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
