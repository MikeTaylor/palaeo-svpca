<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName svpca.org
  DocumentRoot /home/mike/palaeo-svpca/htdocs
  <Directory /home/mike/palaeo-svpca/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  SSLCertificateFile /etc/letsencrypt/live/marsh.dinodb.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/marsh.dinodb.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

<VirtualHost *:443>
  ServerName legacy.svpca.org
  DocumentRoot /home/mike/palaeo-svpca/htdocs
  <Directory /home/mike/palaeo-svpca/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  SSLCertificateFile /etc/letsencrypt/live/marsh.dinodb.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/marsh.dinodb.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
